{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
    .product-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .product {
      width: 260px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .product:hover {
      transform: translateY(-5px);
    }
    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .product-details {
      padding: 15px;
    }
    .product h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }
    .product p {
      margin: 0;
      color: #555;
    }
    .product .price {
      margin-top: 10px;
      font-weight: bold;
      color: #000;
    }
  </style>
</head>
<body>
  <h1>All Products</h1>
  <div class="product-container">
    {% for product in products %}
      <div class="product">
        <img src="{{ product.thumbnail.url }}" alt="{{ product.name }}">
        <div class="product-details">
          <h2>{{ product.name }}</h2>
          <p>{{ product.description|truncatechars:80 }}</p>
          <p class="price">₹{{ product.price }}</p>
        </div>
      </div>
    {% empty %}
      <p>No products found.</p>
    {% endfor %}
  </div>
</body>
</html>
